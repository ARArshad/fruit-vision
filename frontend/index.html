<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FruitVision</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <h1 class="title">FruitVision</h1>
      <p class="subtitle">Upload a fruit image to receive AI-powered predictions.</p>

      <div class="card">
        <input id="file-input" type="file" accept="image/*" hidden />
        <button id="choose-btn" type="button" class="choose-btn">Choose an image</button>
        <button id="predict-btn" type="button" class="predict-btn" disabled>Predict</button>

        <img id="preview-img" class="preview hidden" alt="Selected fruit" />

        <div id="result" class="result-box hidden"></div>
      </div>

      <footer>
        <span id="model-info">Checking model&hellip;</span>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
